namespace: item-manager

backend:
  image: stanley80/item-manager-backend
  tag: latest
  replicas: 2
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

frontend:
  image: stanley80/item-manager-frontend
  tag: latest
  replicas: 2
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  nodePort: 30080

postgres:
  image: postgres
  tag: 16-alpine
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage: 1Gi
  storageClassName: standard

config:
  pgHost: postgres
  pgPort: "5432"
  pgUser: Stanley
  pgDatabase: itemsdb
  # Update this to match the frontend's externally reachable URL before deploying,
  # e.g. "http://<EC2_PUBLIC_IP>:8080".
  corsOrigin: "http://13.50.106.22:8080"

secret:
  # Change this before applying to any real environment.
  postgresPassword: "Stanley_247$"

# EKS-only — always defined here (even though unused on Minikube) so templates can safely
# reference .Values.secretsManager.enabled / .Values.serviceAccount.* without a nil-pointer
# template error. Real values come from helm/values-eks.yaml, never from here.
secretsManager:
  enabled: false
  postgresSecretArn: ""

serviceAccount:
  create: false
  name: default
  roleArn: ""
