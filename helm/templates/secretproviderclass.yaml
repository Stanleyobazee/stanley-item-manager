{{- if .Values.secretsManager.enabled }}
# EKS only. Requires the Secrets Store CSI Driver + AWS provider installed in-cluster first
# (imperative Helm install, not Terraform- or chart-managed — see terraform/README.md).
#
# Pulls the Postgres password from Secrets Manager and syncs it into a native Secret with
# the same name/key (item-manager-secret / POSTGRES_PASSWORD) that backend.yaml and
# postgres.yaml already reference via secretKeyRef — so neither of those needed a rewrite,
# just the small conditional CSI volume/mount block that actually triggers the sync (see
# below in backend.yaml/postgres.yaml — the sync only fires once some pod mounts this).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: item-manager-aws-secrets
  namespace: {{ .Values.namespace }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "{{ .Values.secretsManager.postgresSecretArn }}"
        objectType: "secretsmanager"
        objectAlias: "postgres-password"
  secretObjects:
    - secretName: item-manager-secret
      type: Opaque
      data:
        # Must reference objectAlias, not the raw ARN above — the CSI driver mounts the file
        # under the alias, and secretObjects correlates by matching that exact mounted
        # filename (see helm/monitoring/eks/secretprovider-alertmanager.yaml for the same
        # pattern, where this was already worked out).
        - objectName: "postgres-password"
          key: POSTGRES_PASSWORD
{{- end }}
