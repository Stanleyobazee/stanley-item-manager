{{- if not .Values.secretsManager.enabled }}
# Minikube path only. On EKS (secretsManager.enabled: true in values-eks.yaml), this Secret
# is instead synced from AWS Secrets Manager by the Secrets Store CSI driver — see
# secretproviderclass.yaml, which creates the same Secret name/key via secretObjects.
apiVersion: v1
kind: Secret
metadata:
  name: item-manager-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secret.postgresPassword | quote }}
{{- end }}
