apiVersion: apps/v1

kind: Deployment
metadata:
  name: item-manager-backend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: item-manager-backend
  template:
    metadata:
      labels:
        app: item-manager-backend
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: item-manager-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: item-manager-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- if .Values.secretsManager.enabled }}
          volumeMounts:
            - name: aws-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
          {{- end }}
      {{- if .Values.secretsManager.enabled }}
      volumes:
        # Mounting this volume is what actually triggers the CSI driver to fetch from
        # Secrets Manager and sync item-manager-secret (see secretproviderclass.yaml) —
        # the app itself doesn't read files from mountPath, it still reads
        # POSTGRES_PASSWORD via the regular secretKeyRef env var above.
        - name: aws-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: item-manager-aws-secrets
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: item-manager-backend-service
  namespace: {{ .Values.namespace }}
  labels:
    app: item-manager-backend
spec:
  type: ClusterIP
  selector:
    app: item-manager-backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
