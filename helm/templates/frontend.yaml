apiVersion: apps/v1
kind: Deployment
metadata:
  name: item-manager-frontend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: item-manager-frontend
  template:
    metadata:
      labels:
        app: item-manager-frontend
    spec:
      containers:
        - name: frontend
          # nginx.conf proxies /api/ to item-manager-backend-service internally, so no
          # BACKEND_URL build-arg is needed for this image (see frontend/Dockerfile).
          image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: item-manager-frontend-service
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: item-manager-frontend
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
      nodePort: {{ .Values.frontend.nodePort }}
