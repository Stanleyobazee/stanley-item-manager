{{- if .Values.serviceAccount.create }}
# EKS only. IRSA-annotated — lets the Secrets Store CSI driver's AWS provider authenticate
# to Secrets Manager as this specific pod identity (see terraform/iam.tf's app_secrets role,
# whose trust policy is scoped to exactly this ServiceAccount).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
{{- end }}
