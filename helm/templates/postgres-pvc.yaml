# Unused - postgres.yaml's StatefulSet provisions its own PVC via volumeClaimTemplates.
# Kept for reference only, mirroring k8s/postgres-pvc.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
