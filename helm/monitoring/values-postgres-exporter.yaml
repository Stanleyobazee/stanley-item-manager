# See README.md ("Install", step 2) for the full install command.
# config.datasource.password is deliberately absent — passed via
# --set-string config.datasource.password=<value> at install time, never committed.

config:
  datasource:
    host: postgres.item-manager.svc.cluster.local
    port: "5432"
    user: Stanley
    database: itemsdb
    sslmode: disable

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

serviceMonitor:
  enabled: true
  namespace: item-manager
  interval: 30s
