# item-manager.pods/resources/node need no app changes (kube-state-metrics/cAdvisor/
# node-exporter). item-manager.application needs backend/index.js's prom-client metrics.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: item-manager-alerts
  namespace: item-manager
  labels:
    release: monitoring
spec:
  groups:
    - name: item-manager.pods
      rules:
        - alert: ItemManagerPodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="item-manager"}[15m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has restarted more than 3 times in the last 15 minutes."

        - alert: ItemManagerPodNotReady
          expr: |
            sum by (namespace, pod) (kube_pod_status_ready{namespace="item-manager", condition="true"} == 0) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} not ready"
            description: "Pod {{ $labels.pod }} in item-manager has been not-ready for more than 10 minutes."

        - alert: ItemManagerDeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{namespace="item-manager"}
              != kube_deployment_status_replicas_available{namespace="item-manager"}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} has fewer replicas available than desired"
            description: "{{ $labels.deployment }} wants more replicas than are currently available — check `kubectl get pods -n item-manager`."

    - name: item-manager.resources
      rules:
        - alert: ItemManagerContainerHighMemory
          expr: |
            container_memory_working_set_bytes{namespace="item-manager", container!=""}
              / on(namespace, pod, container) kube_pod_container_resource_limits{namespace="item-manager", resource="memory"}
              > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.container }} is near its memory limit"
            description: "{{ $labels.container }} in pod {{ $labels.pod }} is using more than 90% of its memory limit — risk of OOMKill."

        - alert: ItemManagerContainerHighCPU
          expr: |
            rate(container_cpu_usage_seconds_total{namespace="item-manager", container!=""}[5m])
              / on(namespace, pod, container) kube_pod_container_resource_limits{namespace="item-manager", resource="cpu"}
              > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.container }} is near its CPU limit"
            description: "{{ $labels.container }} in pod {{ $labels.pod }} has used over 90% of its CPU limit for 10+ minutes."

        - alert: ItemManagerPostgresPVCNearFull
          expr: |
            kubelet_volume_stats_available_bytes{namespace="item-manager", persistentvolumeclaim=~"postgres-storage-postgres-0"}
              / kubelet_volume_stats_capacity_bytes{namespace="item-manager", persistentvolumeclaim=~"postgres-storage-postgres-0"}
              < 0.15
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Postgres PVC is running low on space"
            description: "Less than 15% free space left on the postgres StatefulSet's PVC — grow it or clean up before Postgres starts rejecting writes."

    - name: item-manager.node
      rules:
        - alert: NodeMemoryPressureHigh
          expr: |
            (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Node memory usage above 90%"
            description: "This box has limited RAM — sustained >90% usage risks the kernel OOM-killing pods across the whole cluster, not just item-manager's."

    - name: item-manager.application
      rules:
        - alert: ItemManagerHighErrorRate
          expr: |
            sum(rate(http_errors_total{app="item-manager-backend"}[5m]))
              / sum(rate(http_requests_total{app="item-manager-backend"}[5m]))
              > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Backend error rate above 5%"
            description: "More than 5% of backend HTTP responses have been 4xx/5xx over the last 5 minutes."

        - alert: ItemManagerHighLatency
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{app="item-manager-backend"}[5m]))) > 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Backend p95 latency above 1s"
            description: "95th percentile response time has been over 1 second for 2+ minutes."
