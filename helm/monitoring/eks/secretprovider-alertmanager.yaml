# EKS only. Applied once via kubectl before installing the monitoring stack, same pattern as
# helm/eks/storageclass-gp3.yaml (not chart-managed — helm/monitoring/ isn't itself a Helm
# chart, just values files for the externally-installed kube-prometheus-stack chart):
#
#   kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f helm/monitoring/eks/secretprovider-alertmanager.yaml
#
# Replace REPLACE_ME_ALERTMANAGER_SECRET_ARN with `terraform output -raw alertmanager_secret_arn`.
#
# objectAlias controls the filename the CSI driver mounts this under — must match
# values-monitoring-eks.yaml's smtp_auth_password_file path exactly
# (/mnt/secrets-store/smtp-password).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: alertmanager-aws-secrets
  namespace: monitoring
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "REPLACE_ME_ALERTMANAGER_SECRET_ARN"
        objectType: "secretsmanager"
        objectAlias: "smtp-password"
