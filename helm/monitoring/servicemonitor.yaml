# Scrapes the backend's /metrics — see README.md for install steps.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: item-manager-backend
  namespace: item-manager
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - item-manager
  selector:
    matchLabels:
      app: item-manager-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
