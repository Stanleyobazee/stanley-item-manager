# Apply once, before the first `helm install` on EKS — not owned by Terraform (an AWS-account
# resource) or by the Helm chart (would be deleted on `helm uninstall`, taking existing PVCs'
# provisioning ability with it). See terraform/README.md / helm/README-eks.md for when to run:
#
#   kubectl apply -f helm/eks/storageclass-gp3.yaml
#
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  type: gp3
