server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxies to the backend Service's cluster-internal DNS name. Resolved lazily
    # (via the variable) so nginx still starts fine outside Kubernetes, e.g. when
    # running this image standalone with `docker run` per GUIDE.md steps 2-3.
    location /api/ {
        resolver 10.96.0.10 ipv6=off;
        set $backend "item-manager-backend-service.item-manager.svc.cluster.local:3000";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
