server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxies to the backend Service's cluster-internal DNS name. Resolved lazily
    # (via the variable) so nginx still starts fine outside Kubernetes, e.g. when
    # running this image standalone with `docker run` per GUIDE.md steps 2-3.
    #
    # __RESOLVER__ is substituted at container startup (see docker-entrypoint.sh) with
    # whatever nameserver Kubernetes actually injected into /etc/resolv.conf for this pod.
    # It is NOT a fixed value: Minikube's CoreDNS ClusterIP (10.96.0.10, this repo's old
    # hardcoded default) and EKS's (something in a completely different Service CIDR, e.g.
    # 172.20.0.10) are different per-cluster, and this same image is pushed to both.
    location /api/ {
        resolver __RESOLVER__ ipv6=off;
        set $backend "item-manager-backend-service.item-manager.svc.cluster.local:3000";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
