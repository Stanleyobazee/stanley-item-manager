# Change the password before applying to any real environment, e.g.:
#   kubectl create secret generic item-manager-secret -n item-manager \
#     --from-literal=POSTGRES_PASSWORD=<your-password> --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: item-manager-secret
  namespace: item-manager
type: Opaque
