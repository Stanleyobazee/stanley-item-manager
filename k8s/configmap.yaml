apiVersion: v1
kind: ConfigMap
metadata:
  name: item-manager-config
  namespace: item-manager
data:
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: postgres
  PGDATABASE: itemsdb
  # Update this to match the frontend's externally reachable URL before deploying,
  # e.g. "http://<EC2_PUBLIC_IP>:30080". "*" is fine for local Minikube testing.
  CORS_ORIGIN: "*"
